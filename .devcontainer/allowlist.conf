# Outbound domain allowlist for tinyproxy.
# One POSIX basic regex per line. Lines starting with # are comments.
#
# To add a domain at runtime (no rebuild needed):
#   1. Edit this file
#   2. From the host: docker compose -f docker-compose.dev.yml kill -s HUP proxy
#
# Patterns are POSIX basic regex — '.' means "any char", use \. for literal dot.
# Always anchor: ^exact\.domain\.com$

# -- Anthropic ---------------------------------------------------------
^api\.anthropic\.com$
^claude\.ai$
^code\.claude\.com$
^statsig\.anthropic\.com$
^sentry\.io$
^o[0-9]+\.ingest\.[a-z]+\.sentry\.io$

# -- GitHub ------------------------------------------------------------
^github\.com$
^api\.github\.com$
^cli\.github\.com$

# -- npm ---------------------------------------------------------------
^registry\.npmjs\.org$

# -- PyPI --------------------------------------------------------------
^pypi\.org$
^files\.pythonhosted\.org$
