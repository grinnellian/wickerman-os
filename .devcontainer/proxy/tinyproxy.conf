User tinyproxy
Group tinyproxy

Port 3128
Listen 0.0.0.0

Timeout 600
MaxClients 100

# Docker network isolation handles access control —
# only the dev container on the isolated network can reach this.
Allow 0.0.0.0/0

# Whitelist mode: deny all domains except those matching the filter file
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterURLs Off
FilterCaseSensitive Off

# Only allow CONNECT (HTTPS tunneling) to port 443
ConnectPort 443

LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Connect

DisableViaHeader Yes
