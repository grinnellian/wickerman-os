[project]
name = "wickerman-os"
dynamic = ["version"]
description = "Self-hosted AI operating system — local LLM inference, chat, pipelines, training"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.dynamic]
version = {attr = "src.shared.version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["wickerman_plugins", "tests"]
# Exclude extracted runtime source — that's the original author's code.
# Lint it separately once we're ready to propose style changes upstream.
exclude = ["src/"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (too noisy for existing code)
]

[tool.ruff.lint.isort]
known-first-party = ["wickerman_plugins"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
